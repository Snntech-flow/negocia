services:
  postgres:
    image: postgres:16-alpine
    container_name: negocialar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-negocialar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-negocialar_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-negocialar_db}
    ports:
      - "5433:5432"
    volumes:
      - negocialar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-negocialar} -d ${POSTGRES_DB:-negocialar_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: negocialar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - negocialar_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  negocialar_pgdata:
    driver: local
  negocialar_redisdata:
    driver: local
